<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Semantic Hub</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/hub.css">
  <script src="/static/js/theme-init.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <a class="brand" href="#/"><span class="brand-mark" id="brandMark"><svg><use href="#i-graph"/></svg></span><span>Semantic Hub</span></a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/catalog" data-nav="catalog">Catalog</a>
        <a href="#/health" data-nav="health">Health</a>
      </nav>
      <span class="spacer"></span>
      <span class="pill" id="modePill" hidden></span>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme"><svg class="i"><use href="#i-moon"/></svg></button>
    </header>

    <main class="view home" id="view"></main>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-graph" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.6" fill="currentColor"/><circle cx="18" cy="8" r="2.6" fill="currentColor"/><circle cx="10" cy="18" r="2.6" fill="currentColor"/><path d="M8.4 6.6l7.2 1M17 10.2l-5.4 6M7 8.3l2.2 7.4" stroke="currentColor" stroke-width="1.6" fill="none"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
